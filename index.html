<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Программные партнеры Гексаграмм</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { position: relative; width: 800px; height: 800px; }
        svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .hex-label { font-size: 12px; fill: #888; cursor: pointer; transition: 0.3s; transform-box: fill-box; transform-origin: center; }
        .hex-label:hover { fill: #fff; font-weight: bold; }
        .partner-line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; transition: 0.3s; }
        .hex-group:hover .partner-line { stroke: #00d4ff; stroke-width: 2; opacity: 1; }
        .hex-group:hover .hex-label { fill: #00d4ff; }
        .center-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        h1 { margin-bottom: 0; font-size: 20px; color: #00d4ff; }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="center-info">
        <h1>ПРОГРАММНЫЕ ПАРТНЕРЫ</h1>
        <p>Наведите на гексаграмму,<br>чтобы увидеть её пару</p>
    </div>

    <div class="container">
        <svg id="wheel" viewBox="0 0 800 800"></svg>
    </div>

<script>
    // Порядок гексаграмм на колесе (от 41 по часовой стрелке)
    const wheelOrder = [
        41, 19, 13, 49, 30, 55, 37, 63, 22, 36, 25, 17, 21, 51, 42, 3, 27, 24, 2, 23, 8, 20, 16, 35, 45, 12, 15, 52, 39, 53, 62, 56,
        31, 33, 7, 4, 29, 59, 40, 64, 47, 6, 46, 18, 48, 57, 32, 50, 28, 44, 1, 43, 14, 34, 9, 5, 26, 11, 10, 58, 38, 54, 61, 60
    ];

    const svg = document.getElementById('wheel');
    const radius = 350;
    const centerX = 400;
    const centerY = 400;

    wheelOrder.forEach((hex, i) => {
        const angle = (i * 360 / 64) * (Math.PI / 180);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        // Находим оппозицию (партнера) через 32 позиции
        const partnerIndex = (i + 32) % 64;
        const partnerAngle = (partnerIndex * 360 / 64) * (Math.PI / 180);
        const px = centerX + radius * Math.cos(partnerAngle);
        const py = centerY + radius * Math.sin(partnerAngle);

        const group = document.createElementNS("http://w3.org", "g");
        group.setAttribute("class", "hex-group");

        // Линия к партнеру
        const line = document.createElementNS("http://w3.org", "line");
        line.setAttribute("x1", x);
        line.setAttribute("y1", y);
        line.setAttribute("x2", px);
        line.setAttribute("y2", py);
        line.setAttribute("class", "partner-line");
        
        // Текст (номер гексаграммы)
        const text = document.createElementNS("http://w3.org", "text");
        text.setAttribute("x", x);
        text.setAttribute("y", y);
        text.setAttribute("class", "hex-label");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("alignment-baseline", "central");
        // Поворачиваем текст обратно, чтобы он читался горизонтально
        text.setAttribute("transform", `rotate(90, ${x}, ${y})`); 
        text.textContent = hex;

        group.appendChild(line);
        group.appendChild(text);
        svg.appendChild(group);
    });
</script>
</body>
</html>
