<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Визуализация Дизайна Человека: Цвет, Тон, База</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .level { margin-bottom: 20px; }
        .label { font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bg { background: #eee; height: 24px; border-radius: 12px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; transition: width 0.1s linear; }
        
        #color-bar { background: #6c5ce7; }
        #tone-bar { background: #00cec9; }
        #base-bar { background: #ff7675; }

        .arrow-box { margin-top: 20px; padding: 15px; border: 2px dashed #ccc; text-align: center; border-radius: 10px; }
        .arrow { font-size: 40px; font-weight: bold; color: #2d3436; }
        .speed-control { margin-top: 20px; font-size: 0.9em; color: #636e72; }
    </style>
</head>
<body>

<div class="container">
    <h2>Фрактальное время HD</h2>
    
    <!-- ЦВЕТ -->
    <div class="level">
        <div class="label"><span>ЦВЕТ (1 из 6)</span> <span id="color-val">1</span></div>
        <div class="progress-bg"><div id="color-bar" class="progress-fill" style="width: 0%"></div></div>
    </div>

    <!-- ТОН -->
    <div class="level">
        <div class="label"><span>ТОН (1 из 6)</span> <span id="tone-val">1</span></div>
        <div class="progress-bg"><div id="tone-bar" class="progress-fill" style="width: 0%"></div></div>
    </div>

    <!-- БАЗА -->
    <div class="level">
        <div class="label"><span>БАЗА (1 из 5)</span> <span id="base-val">1</span></div>
        <div class="progress-bg"><div id="base-bar" class="progress-fill" style="width: 0%"></div></div>
    </div>

    <!-- СТРЕЛКА -->
    <div class="arrow-box">
        <div>Направление стрелки (зависит от тона):</div>
        <div id="arrow-dir" class="arrow">←</div>
        <div id="arrow-text">ЛЕВАЯ (Активная)</div>
    </div>

    <div class="speed-control">
        * Скорость увеличена для демонстрации (1 сек = 1 база)
    </div>
</div>

<script>
    let color = 1, tone = 1, base = 1;
    let baseProgress = 0;

    function update() {
        baseProgress += 5; // шаг анимации

        if (baseProgress >= 100) {
            baseProgress = 0;
            base++;
            if (base > 5) {
                base = 1;
                tone++;
                if (tone > 6) {
                    tone = 1;
                    color++;
                    if (color > 6) color = 1;
                }
            }
        }

        // Обновление баров
        document.getElementById('base-bar').style.width = baseProgress + '%';
        document.getElementById('tone-bar').style.width = ((tone - 1) * 16.6 + (base - 1) * 3.3) + '%';
        document.getElementById('color-bar').style.width = ((color - 1) * 16.6) + '%';

        // Обновление цифр
        document.getElementById('color-val').innerText = color;
        document.getElementById('tone-val').innerText = tone;
        document.getElementById('base-val').innerText = base;

        // Логика стрелки (1-3 влево, 4-6 вправо)
        const arrow = document.getElementById('arrow-dir');
        const text = document.getElementById('arrow-text');
        if (tone <= 3) {
            arrow.innerText = '←';
            text.innerText = 'ЛЕВАЯ (Стратегическая / Фокус)';
            text.style.color = '#2d3436';
        } else {
            arrow.innerText = '→';
            text.innerText = 'ПРАВАЯ (Восприимчивая / Периферия)';
            text.style.color = '#e17055';
        }
    }

    setInterval(update, 50); // Запуск цикла
</script>
</body>
</html>
