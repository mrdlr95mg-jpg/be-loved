<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сатурн на орбите</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #444; pointer-events: none; z-index: 10; }
        .marker { display: flex; align-items: center; margin: 5px 0; font-size: 14px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <b>Сатурн на орбите</b>
        <div class="marker"><div class="dot" style="background: #a67c52"></div> Сатурн (планета)</div>
        <div class="marker"><div class="dot" style="background: #00f2ff"></div> Водолей 22°</div>
        <div class="marker"><div class="dot" style="background: #ff00ff"></div> Рыбы 10°</div>
        <small style="opacity: 0.6">Кольцо разделено на знаки Зодиака</small>
    </div>

    <!-- ИСПРАВЛЕННАЯ ССЫЛКА НА БИБЛИОТЕКУ -->
    <script src="https://cdnjs.cloudflare.com"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. СОЛНЦЕ
        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 32, 32), 
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        scene.add(sun);

        // 2. ЗОДИАКАЛЬНОЕ КОЛЬЦО
        const zodiacRadius = 12;
        for (let i = 0; i < 12; i++) {
            const segmentGeo = new THREE.RingGeometry(zodiacRadius, zodiacRadius + 0.5, 32, 1, (i * Math.PI * 2) / 12, (Math.PI * 2) / 12 - 0.05);
            const color = i % 2 === 0 ? 0x222222 : 0x333333;
            const segment = new THREE.Mesh(segmentGeo, new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide }));
            segment.rotation.x = Math.PI / 2;
            scene.add(segment);
        }

        // 3. ОРБИТА САТУРНА
        const orbitRadius = 10;
        const orbitPath = new THREE.Mesh(
            new THREE.TorusGeometry(orbitRadius, 0.02, 16, 100),
            new THREE.MeshBasicMaterial({ color: 0x555555 })
        );
        orbitPath.rotation.x = Math.PI / 2;
        scene.add(orbitPath);

        function getPos(deg) {
            const rad = (deg - 90) * (Math.PI / 180);
            return { x: Math.cos(rad) * orbitRadius, z: Math.sin(rad) * orbitRadius };
        }

        // 4. ТОЧКИ НА ОРБИТЕ
        const markerGeo = new THREE.SphereGeometry(0.2, 16, 16);
        
        const pos1 = getPos(322); // Водолей 22
        const m1 = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({ color: 0x00f2ff }));
        m1.position.set(pos1.x, 0, pos1.z);
        scene.add(m1);

        const pos2 = getPos(340); // Рыбы 10
        const m2 = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({ color: 0xff00ff }));
        m2.position.set(pos2.x, 0, pos2.z);
        scene.add(m2);

        // 5. САТУРН
        const saturnGroup = new THREE.Group();
        const saturnBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 32, 32), 
            new THREE.MeshPhongMaterial({ color: 0xceb8b0, shininess: 10 })
        );
        const ringGeo = new THREE.TorusGeometry(0.9, 0.05, 2, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xa67c52, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.5;
        saturnGroup.add(saturnBody);
        saturnGroup.add(ring);
        scene.add(saturnGroup);

        // СВЕТ
        const light = new THREE.PointLight(0xffffff, 2, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x444444)); // Сделал чуть ярче фон

        camera.position.set(15, 18, 15);
        camera.lookAt(0, 0, 0);

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.002;
            
            // Движение Сатурна
            const sAngle = time * 0.3 - 1.2;
            saturnGroup.position.x = Math.cos(sAngle) * orbitRadius;
            saturnGroup.position.z = Math.sin(sAngle) * orbitRadius;
            saturnGroup.rotation.y += 0.01; // Вращение планеты вокруг оси

            // Вращение камеры
            camera.position.x = Math.cos(time * 0.1) * 22;
            camera.position.z = Math.sin(time * 0.1) * 22;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Авто-ресайз при изменении окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
