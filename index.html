<!DOCTYPE html>
<html>
<head>
    <title>3D Lunar Nodes Visualization</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <b>Лунные узлы: Механика</b><br>
        Пересечение плоскости эклиптики (желтая) и орбиты Луны (белая)
    </div>
    <script src="https://cdnjs.cloudflare.com"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. Земля в центре
        const earthGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const earthMat = new THREE.MeshPhongMaterial({ color: 0x2233ff, emissive: 0x112244 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);

        // 2. Плоскость эклиптики (Путь Солнца)
        const eclipticGeo = new THREE.RingGeometry(4.5, 5, 64);
        const eclipticMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
        const ecliptic = new THREE.Mesh(eclipticGeo, eclipticMat);
        ecliptic.rotation.x = Math.PI / 2;
        scene.add(ecliptic);

        // 3. Орбита Луны (наклонная)
        const moonOrbitGroup = new THREE.Group();
        const moonOrbitGeo = new THREE.TorusGeometry(4.75, 0.02, 16, 100);
        const moonOrbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const moonOrbit = new THREE.Mesh(moonOrbitGeo, moonOrbitMat);
        moonOrbit.rotation.x = Math.PI / 2;
        moonOrbitGroup.add(moonOrbit);
        
        // Наклон орбиты (реальный ~5.14 градусов, здесь чуть больше для наглядности)
        moonOrbitGroup.rotation.z = Math.PI / 8; 
        moonOrbitGroup.rotation.x = 0.15; 
        scene.add(moonOrbitGroup);

        // 4. Лунные Узлы (точки пересечения)
        const nodeGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        
        const northNode = new THREE.Mesh(nodeGeo, nodeMat);
        northNode.position.set(4.75, 0, 0); // Точка на оси пересечения
        scene.add(northNode);

        const southNode = new THREE.Mesh(nodeGeo, nodeMat);
        southNode.position.set(-4.75, 0, 0);
        scene.add(southNode);

        // Свет
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(8, 5, 8);
        camera.lookAt(0, 0, 0);

        // Анимация вращения камеры
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0005;
            camera.position.x = Math.cos(time) * 10;
            camera.position.z = Math.sin(time) * 10;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
