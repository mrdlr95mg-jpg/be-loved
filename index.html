<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Программные партнеры по цветам</title>
    <style>
        body { background: #0a0c0e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { position: relative; width: 800px; height: 800px; }
        svg { width: 100%; height: 100%; }
        
        .hex-text { font-size: 13px; font-weight: bold; transition: 0.3s; pointer-events: none; }
        .partner-link { fill: none; stroke-width: 3; stroke-linecap: round; opacity: 0.4; transition: 0.4s; }
        
        /* Эффект при наведении на группу пары */
        .pair-group:hover .partner-link { opacity: 1; stroke-width: 6; filter: drop-shadow(0 0 8px currentColor); }
        .pair-group:hover .hex-text { fill: #fff !important; font-size: 16px; }
        
        .legend { position: absolute; bottom: 20px; font-size: 12px; color: #555; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <svg id="canvas" viewBox="0 0 800 800"></svg>
    </div>
    <div class="legend">Наведите на число, чтобы подсветить программную пару</div>

<script>
    const svg = document.getElementById('canvas');
    const cx = 400, cy = 400, r = 340;

    // Список программных партнеров (1-2, 3-50, 4-49 и т.д. согласно рейв-мандале)
    // Для примера возьмем логику оппозиции 32 шага, но в порядке возрастания
    const pairs = [];
    const used = new Set();
    
    // Генерируем пары (разница в 32 позиции на колесе)
    // Примечание: 1-2, 51-57 и т.д. — это пары, стоящие друг напротив друга
    const wheelOrder = [
        41, 19, 13, 49, 30, 55, 37, 63, 22, 36, 25, 17, 21, 51, 42, 3, 
        27, 24, 2, 23, 8, 20, 16, 35, 45, 12, 15, 52, 39, 53, 62, 56, 
        31, 33, 7, 4, 29, 59, 40, 64, 47, 6, 46, 18, 48, 57, 32, 50, 
        28, 44, 1, 43, 14, 34, 9, 5, 26, 11, 10, 58, 38, 54, 61, 60
    ];

    for(let i=0; i<32; i++) {
        pairs.push([wheelOrder[i], wheelOrder[i+32]]);
    }

    // Рисуем гексаграммы по порядку 1, 2, 3...
    const hexCoords = {};
    for (let i = 1; i <= 64; i++) {
        const angle = (i - 1) * (360 / 64) * (Math.PI / 180) - Math.PI/2;
        hexCoords[i] = {
            x: cx + r * Math.cos(angle),
            y: cy + r * Math.sin(angle),
            angle: angle
        };
    }

    pairs.forEach((pair, index) => {
        const [h1, h2] = pair;
        const color = `hsl(${(index * 360 / 32)}, 70%, 60%)`;
        
        const group = document.createElementNS("http://w3.org", "g");
        group.setAttribute("class", "pair-group");
        group.style.color = color; // Для использования currentColor

        // Линия-дуга между партнерами
        const link = document.createElementNS("http://w3.org", "path");
        const c1 = hexCoords[h1], c2 = hexCoords[h2];
        
        // Рисуем дугу через внутренний радиус
        const midR = r - 60;
        const midX = cx + midR * Math.cos((c1.angle + c2.angle)/2);
        const midY = cy + midR * Math.sin((c1.angle + c2.angle)/2);
        
        link.setAttribute("d", `M ${c1.x} ${c1.y} Q ${midX} ${midY} ${c2.x} ${c2.y}`);
        link.setAttribute("class", "partner-link");
        link.setAttribute("stroke", color);

        const label = (h) => {
            const t = document.createElementNS("http://w3.org", "text");
            t.setAttribute("x", hexCoords[h].x);
            t.setAttribute("y", hexCoords[h].y);
            t.setAttribute("class", "hex-text");
            t.setAttribute("text-anchor", "middle");
            t.setAttribute("alignment-baseline", "central");
            t.setAttribute("fill", color);
            t.textContent = h;
            return t;
        };

        group.appendChild(link);
        group.appendChild(label(h1));
        group.appendChild(label(h2));
        svg.appendChild(group);
    });
</script>
</body>
</html>
