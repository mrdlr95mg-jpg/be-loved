<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Смена Крестов в Human Design</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .wheel-container { position: relative; width: 600px; height: 150px; background: #16213e; border-radius: 75px; display: flex; align-items: center; padding: 0 50px; box-sizing: border-box; border: 2px solid #485460; overflow: hidden; }
        .line-marker { flex: 1; text-align: center; position: relative; z-index: 2; transition: all 0.5s; font-weight: bold; opacity: 0.4; }
        .line-marker.active { opacity: 1; transform: scale(1.3); color: #00d2ff; }
        .line-marker span { display: block; font-size: 12px; margin-top: 5px; }
        
        #pointer { position: absolute; width: 60px; height: 60px; background: rgba(0, 210, 255, 0.2); border: 2px solid #00d2ff; border-radius: 50%; left: 50px; transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; box-shadow: 0 0 20px #00d2ff; }

        .info-card { margin-top: 40px; background: #0f3460; padding: 25px; border-radius: 15px; width: 500px; text-align: center; border-left: 5px solid #00d2ff; }
        .cross-title { font-size: 24px; margin-bottom: 10px; color: #e94560; text-transform: uppercase; letter-spacing: 2px; }
        .cross-desc { font-size: 16px; line-height: 1.5; color: #a2a8d3; }
        
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #e94560; border: none; color: white; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff5e78; }
    </style>
</head>
<body>

    <h1>Эволюция Креста (Линии 1-6)</h1>

    <div class="wheel-container">
        <div id="pointer"></div>
        <div class="line-marker" id="m1">1<span>Исследователь</span></div>
        <div class="line-marker" id="m2">2<span>Отшельник</span></div>
        <div class="line-marker" id="m3">3<span>Мученик</span></div>
        <div class="line-marker" id="m4">4<span>Опортунист</span></div>
        <div class="line-marker" id="m5">5<span>Еретик</span></div>
        <div class="line-marker" id="m6">6<span>Ролевая модель</span></div>
    </div>

    <div class="info-card">
        <div id="cross-type" class="cross-title">Правоугольный Крест</div>
        <div id="cross-info" class="cross-desc">Личная судьба. Вы здесь, чтобы познать себя и свой путь через собственный опыт. Другие люди — лишь декорации.</div>
    </div>

    <div class="controls">
        <button onclick="prev()">⬅ Назад</button>
        <button onclick="next()">Вперед (По Линиям) ➡</button>
    </div>

<script>
    let currentLine = 1;
    const markers = document.querySelectorAll('.line-marker');
    const pointer = document.getElementById('pointer');
    const typeTitle = document.getElementById('cross-type');
    const infoText = document.getElementById('cross-info');

    const data = {
        1: { title: "Правоугольный (Personal)", text: "1 Линия: Фундамент. Вы погружены в изучение предмета. Личная геометрия." },
        2: { title: "Правоугольный (Personal)", text: "2 Линия: Дар. Вы естественны в своем процессе, не нуждаетесь в учителях." },
        3: { title: "Правоугольный (Personal)", text: "3 Линия: Связи. Вы учитесь на ошибках. Процесс 'проб и ошибок' — ваш путь." },
        4: { title: "Джакста-позиция (Fixed)", text: "4 Линия: Влияние. Редкая фиксированная судьба. Переход от личного к коллективному." },
        5: { title: "Левоугольный (Interpersonal)", text: "5 Линия: Проекции. Ваша судьба неразрывно связана с другими. Вы — спаситель или изгой." },
        6: { title: "Левоугольный (Interpersonal)", text: "6 Линия: Мудрость. Наблюдение за целым миром. Выход за пределы личного опыта." }
    };

    function update() {
        markers.forEach(m => m.classList.remove('active'));
        document.getElementById('m' + currentLine).classList.add('active');
        
        pointer.style.left = (50 + (currentLine - 1) * 83) + 'px';
        
        typeTitle.innerText = data[currentLine].title;
        infoText.innerText = data[currentLine].text;

        // Цветовая индикация смены креста
        if (currentLine <= 3) typeTitle.style.color = "#00d2ff"; // Голубой (Личный)
        else if (currentLine == 4) typeTitle.style.color = "#fbc531"; // Желтый (Фикс)
        else typeTitle.style.color = "#e94560"; // Красный (Трансперсональный)
    }

    function next() {
        if (currentLine < 6) { currentLine++; update(); }
    }
    function prev() {
        if (currentLine > 1) { currentLine--; update(); }
    }

    update();
</script>
</body>
</html>
