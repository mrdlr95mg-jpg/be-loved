<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Эволюция Инкарнационного Креста</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0c29; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .stage { position: relative; width: 450px; height: 450px; border: 2px solid #34495e; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .axis { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.1); }
        .axis.vert { transform: rotate(90deg); }
        
        /* Планеты */
        .planet { position: absolute; width: 20px; height: 20px; border-radius: 50%; z-index: 10; transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .p-sun { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; } /* Солнце Личности */
        .p-earth { background: #27ae60; box-shadow: 0 0 15px #27ae60; } /* Земля Личности */
        .d-sun { background: #e74c3c; box-shadow: 0 0 15px #e74c3c; } /* Солнце Дизайна */
        .d-earth { background: #c0392b; box-shadow: 0 0 15px #c0392b; } /* Земля Дизайна */

        .label-box { position: absolute; top: -60px; text-align: center; width: 300px; }
        .profile-tag { font-size: 42px; font-weight: bold; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }
        .cross-type { font-size: 18px; text-transform: uppercase; letter-spacing: 3px; margin-top: 10px; }
        
        .controls { margin-top: 50px; display: flex; gap: 20px; }
        button { padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; background: #3498db; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        .desc { max-width: 400px; text-align: center; margin-top: 20px; color: #bdc3c7; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="label-box">
        <div id="profile" class="profile-tag">1 / 3</div>
        <div id="type" class="cross-type">Правоугольный Крест</div>
    </div>

    <div class="stage">
        <div class="axis"></div>
        <div class="axis vert"></div>
        
        <!-- Личность (Черное/Цветное) -->
        <div id="psun" class="planet p-sun"></div>
        <div id="pearth" class="planet p-earth"></div>
        
        <!-- Дизайн (Красное) -->
        <div id="dsun" class="planet d-sun"></div>
        <div id="dearth" class="planet d-earth"></div>
    </div>

    <div class="controls">
        <button onclick="changeStep(-1)">⬅ Назад</button>
        <button onclick="changeStep(1)">Следующий этап ➡</button>
    </div>

    <div id="desc" class="desc">
        Линии 1, 2, 3: Личная судьба. Весь фокус внутри вашей собственной геометрии.
    </div>

<script>
    let step = 0;
    const steps = [
        { p: "1 / 3", t: "Правоугольный", a: 0, d: "Линии 1, 2, 3: Личная судьба. Вы здесь, чтобы исследовать мир для себя.", c: "#00d2ff" },
        { p: "4 / 6", t: "Правоугольный (Финал)", a: 45, d: "Линия 4 в личности: Вы начинаете замечать других, но крест всё еще 'Правый'.", c: "#00d2ff" },
        { p: "4 / 1", t: "Джакста-позиция", a: 60, d: "Уникальная точка 'Фиксированной судьбы'. Тонкая грань между личным и общим.", c: "#f1c40f" },
        { p: "5 / 1", t: "Левоугольный", a: 90, d: "Линия 5: Трансперсональная карма. Вы здесь для взаимодействия и влияния на других.", c: "#e74c3c" },
        { p: "6 / 2", t: "Левоугольный", a: 130, d: "Линия 6: Ролевая модель. Переход к наблюдению за всем циклом целиком.", c: "#e74c3c" }
    ];

    function update() {
        const s = steps[step];
        document.getElementById('profile').innerText = s.p;
        document.getElementById('type').innerText = s.t;
        document.getElementById('type').style.color = s.c;
        document.getElementById('desc').innerText = s.d;

        const radius = 180;
        const angle = s.a;

        // Личность
        setPos('psun', angle, radius);
        setPos('pearth', angle + 180, radius);
        
        // Дизайн (отстает на ~88 градусов)
        setPos('dsun', angle - 88, radius);
        setPos('dearth', angle + 180 - 88, radius);
    }

    function setPos(id, deg, r) {
        const rad = deg * Math.PI / 180;
        const x = Math.cos(rad) * r;
        const y = Math.sin(rad) * r;
        const el = document.getElementById(id);
        el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function changeStep(dir) {
        step = (step + dir + steps.length) % steps.length;
        update();
    }

    update();
</script>
</body>
</html>
