<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #0a0a0c; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .dna-container { position: relative; width: 400px; height: 600px; display: flex; flex-direction: column; align-items: center; }
    
    /* Стилизация ступеней спирали */
    .step { display: flex; align-items: center; margin: 5px 0; perspective: 500px; transition: 0.5s; }
    .base { width: 80px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
    
    /* Цвета оснований */
    .A { background: #ff4757; color: white; } /* Аденин */
    .T { background: #2f3542; color: #747d8c; border: 1px solid #57606f; } /* Тимин */
    .G { background: #2ed573; color: white; } /* Гуанин */
    .C { background: #1e90ff; color: white; } /* Цитозин */

    .connector { width: 100px; height: 2px; background: rgba(255,255,255,0.2); margin: 0 10px; }

    /* Визуализация Гексаграммы */
    .hex-display { position: absolute; right: -150px; top: 50%; transform: translateY(-50%); border-left: 2px solid #535c68; padding-left: 20px; }
    .hex-line { width: 50px; height: 6px; margin: 4px 0; background: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
    .hex-line.broken { background: none; border-top: 6px dashed #f1c40f; box-shadow: none; }
    
    .bracket { position: absolute; left: -40px; top: 0; bottom: 0; border: 2px solid #f1c40f; border-right: none; width: 20px; border-radius: 10px 0 0 10px; }
    .label { position: absolute; left: -180px; top: 50%; transform: translateY(-50%); color: #f1c40f; font-size: 12px; text-align: right; width: 130px; }
</style>
</head>
<body>

<div class="dna-container">
    <!-- Группа из 3-х нуклеотидов (Кодон = Гексаграмма) -->
    <div style="position: relative; border: 1px rgba(241, 196, 15, 0.3) dashed; padding: 10px; border-radius: 10px;">
        <div class="label">ОДИН КОДОН<br>(Гексаграмма И-Цзин)</div>
        <div class="bracket"></div>
        
        <!-- Нуклеотид 1 (2 линии) -->
        <div class="step"><div class="base G">G (Ян-Инь)</div><div class="connector"></div><div class="base C">C</div></div>
        <!-- Нуклеотид 2 (2 линии) -->
        <div class="step"><div class="base A">A (Инь-Ян)</div><div class="connector"></div><div class="base T">T</div></div>
        <!-- Нуклеотид 3 (2 линии) -->
        <div class="step"><div class="base T">T (Ян-Ян)</div><div class="connector"></div><div class="base A">A</div></div>

        <!-- Результирующая гексаграмма -->
        <div class="hex-display">
            <div class="hex-line"></div> <!-- Линия 6 (от T) -->
            <div class="hex-line"></div> <!-- Линия 5 (от T) -->
            <div class="hex-line"></div> <!-- Линия 4 (от A) -->
            <div class="hex-line broken"></div> <!-- Линия 3 (от A) -->
            <div class="hex-line broken"></div> <!-- Линия 2 (от G) -->
            <div class="hex-line"></div> <!-- Линия 1 (от G) -->
            <div style="margin-top: 10px; font-size: 10px; color: #95a5a6;">Гексаграмма №5<br>"Ожидание"</div>
        </div>
    </div>
    <p style="margin-top: 40px; color: #7f8c8d; font-size: 14px; text-align: center;">
        Каждая "ступенька" спирали — это 2 линии.<br>
        3 ступеньки вместе создают код из 6 линий.
    </p>
</div>

</body>
</html>
