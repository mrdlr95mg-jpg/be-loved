<!DOCTYPE html>
<html>
<head>
    <title>3D Lunar Nodes - Mechanical View</title>
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: sans-serif; overflow: hidden; }
        #overlay { position: absolute; padding: 20px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        .node-label { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay">
        <h2>Механика Лунных Узлов</h2>
        <p>Голубой шар в центре — <b>Земля</b></p>
        <p>Сетка — <b>Плоскость Эклиптики</b> (путь Солнца)</p>
        <p>Белое кольцо — <b>Орбита Луны</b> (наклонена на 5°)</p>
        <p class="node-label">Красные сферы — ЛУННЫЕ УЗЛЫ</p>
        <p style="font-size: 0.9em; opacity: 0.7;">Это просто точки пересечения двух плоскостей.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. СЕТКА (Плоскость Эклиптики / "Пол" Солнечной системы)
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(grid);

        // 2. ЗЕМЛЯ
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(0.6, 32, 32),
            new THREE.MeshPhongMaterial({ color: 0x0077ff, emissive: 0x050505 })
        );
        scene.add(earth);

        // 3. ОРБИТА ЛУНЫ (Наклоненное кольцо)
        const orbitGroup = new THREE.Group();
        const torusGeo = new THREE.TorusGeometry(7, 0.05, 16, 100);
        const torusMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
        const orbitRing = new THREE.Mesh(torusGeo, torusMat);
        orbitRing.rotation.x = Math.PI / 2;
        orbitGroup.add(orbitRing);

        // Наклон орбиты (сделаем 15 градусов вместо 5 для наглядности)
        orbitGroup.rotation.x = 0.25; 
        scene.add(orbitGroup);

        // 4. ЛУННЫЕ УЗЛЫ (Красные точки в местах "прокола" сетки)
        const nodeGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        // Северный узел
        const nodeN = new THREE.Mesh(nodeGeo, nodeMat);
        nodeN.position.set(7, 0, 0); 
        scene.add(nodeN);

        // Южный узел
        const nodeS = new THREE.Mesh(nodeGeo, nodeMat);
        nodeS.position.set(-7, 0, 0);
        scene.add(nodeS);

        // Линия узлов (соединяет их через центр Земли)
        const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.3 });
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-7, 0, 0),
            new THREE.Vector3(7, 0, 0)
        ]);
        const nodeLine = new THREE.Line(lineGeo, lineMat);
        scene.add(nodeLine);

        // Свет
        const light = new THREE.PointLight(0xffffff, 1.2, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(12, 8, 12);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            // Медленное вращение камеры, чтобы видеть объем
            const timer = Date.now() * 0.0003;
            camera.position.x = Math.cos(timer) * 15;
            camera.position.z = Math.sin(timer) * 15;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
