<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Механика Лунных Узлов</title>
    <style>
        body { margin: 0; background: #050510; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { display: block; }
        .info { position: absolute; top: 20px; text-align: center; pointer-events: none; width: 100%; }
        .node-label { position: absolute; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.7); border: 1px solid #444; font-size: 14px; max-width: 200px; }
        #south { color: #ff7675; border-color: #ff7675; }
        #north { color: #74b9ff; border-color: #74b9ff; }
        .controls { position: absolute; bottom: 30px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; backdrop-filter: blur(5px); text-align: center; }
    </style>
</head>
<body>

<div class="info">
    <h1>Геометрия Лунных Узлов</h1>
    <p>Пересечение пути Земли и Луны</p>
</div>

<div id="south" class="node-label"><b>Южный Узел (Кету)</b><br>Прошлое, Среда, фундамент. То, что нам уже знакомо.</div>
<div id="north" class="node-label"><b>Северный Узел (Раху)</b><br>Будущее, Перспектива. То, к чему мы движемся.</div>

<div class="controls">
    Узлы движутся <b>навстречу</b> планетам (ретроградно).<br>
    Они определяют не "кто вы", а "в каком мире вы живете".
</div>

<script src="https://cdnjs.cloudflare.com"></script>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Центральная Земля
    const earthGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const earthMat = new THREE.MeshPhongMaterial({ color: 0x22a6b3, emissive: 0x111111 });
    const earth = new THREE.Mesh(earthGeo, earthMat);
    scene.add(earth);

    const light = new THREE.PointLight(0xffffff, 1.5);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Орбита Солнца (Эклиптика) - Белая
    const eclipticGeo = new THREE.TorusGeometry(4, 0.01, 16, 100);
    const eclipticMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
    const ecliptic = new THREE.Mesh(eclipticGeo, eclipticMat);
    ecliptic.rotation.x = Math.PI / 2;
    scene.add(ecliptic);

    // Орбита Луны - Наклоненная
    const moonOrbitGroup = new THREE.Group();
    const moonOrbitGeo = new THREE.TorusGeometry(4, 0.02, 16, 100);
    const moonOrbitMat = new THREE.MeshBasicMaterial({ color: 0x6c5ce7, transparent: true, opacity: 0.5 });
    const moonOrbit = new THREE.Mesh(moonOrbitGeo, moonOrbitMat);
    moonOrbit.rotation.x = Math.PI / 2;
    moonOrbitGroup.add(moonOrbit);
    moonOrbitGroup.rotation.z = 0.15; // Угол наклона
    scene.add(moonOrbitGroup);

    // Точки Узлов
    const nodeGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const northNode = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0x74b9ff }));
    const southNode = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0xff7675 }));
    scene.add(northNode);
    scene.add(southNode);

    camera.position.z = 8;
    camera.position.y = 4;
    camera.lookAt(0,0,0);

    let angle = 0;
    function animate() {
        requestAnimationFrame(animate);
        angle += 0.005; // Скорость прецессии узлов

        // Расчет точек пересечения (Узлов)
        // В упрощенной 3D модели они находятся на оси пересечения двух плоскостей
        const x = Math.cos(angle) * 4;
        const z = Math.sin(angle) * 4;
        
        northNode.position.set(x, 0, z);
        southNode.position.set(-x, 0, -z);

        // Привязка ярлыков
        updateLabel('north', northNode);
        updateLabel('south', southNode);

        moonOrbitGroup.rotation.y = angle; // Вращение линии узлов
        renderer.render(scene, camera);
    }

    function updateLabel(id, obj) {
        const vector = obj.position.clone().project(camera);
        const x = (vector.x *  .5 + .5) * window.innerWidth;
        const y = (vector.y * -.5 + .5) * window.innerHeight;
        const el = document.getElementById(id);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
    }

    animate();
</script>
</body>
</html>
