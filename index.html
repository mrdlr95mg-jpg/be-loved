<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Программные партнеры: Числовой порядок</title>
    <style>
        body { background: #0f1215; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .container { position: relative; width: 750px; height: 750px; }
        svg { width: 100%; height: 100%; }
        
        .hex-node { cursor: pointer; transition: 0.3s; }
        .hex-text { font-size: 14px; font-weight: bold; fill: #666; transition: 0.3s; pointer-events: none; }
        
        /* Линия связи между партнерами */
        .partner-arc { fill: none; stroke: rgba(0, 212, 255, 0.15); stroke-width: 2; stroke-linecap: round; transition: 0.4s; }
        
        /* Эффекты при наведении */
        .hex-group:hover .partner-arc { stroke: #00d4ff; stroke-width: 4; filter: drop-shadow(0 0 5px #00d4ff); }
        .hex-group:hover .hex-text { fill: #fff; }
        
        .info { position: absolute; text-align: center; width: 200px; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #333; padding: 15px; border-radius: 50%; background: rgba(255,255,255,0.02); }
        h2 { font-size: 16px; color: #00d4ff; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="info">
        <h2>Программные пары</h2>
        <p style="font-size: 11px; color: #555;">Гексаграммы по порядку<br>1-2, 3-4, 5-6...</p>
    </div>

    <div class="container">
        <svg id="canvas" viewBox="0 0 800 800"></svg>
    </div>

<script>
    const svg = document.getElementById('canvas');
    const centerX = 400;
    const centerY = 400;
    const radius = 340;

    // Генерируем 32 пары (1-2, 3-4, ... 63-64)
    for (let i = 1; i <= 63; i += 2) {
        const pairGroup = document.createElementNS("http://w3.org", "g");
        pairGroup.setAttribute("class", "hex-group");

        // Углы для двух партнеров (располагаем их рядом)
        const angle1 = (i - 1) * (360 / 64) * (Math.PI / 180);
        const angle2 = i * (360 / 64) * (Math.PI / 180);

        const x1 = centerX + radius * Math.cos(angle1);
        const y1 = centerY + radius * Math.sin(angle1);
        const x2 = centerX + radius * Math.cos(angle2);
        const y2 = centerY + radius * Math.sin(angle2);

        // Рисуем дугу/линию объединения между ними
        const arc = document.createElementNS("http://w3.org", "path");
        // Небольшой изгиб для красоты
        const midR = radius + 25;
        const midX = centerX + midR * Math.cos((angle1 + angle2) / 2);
        const midY = centerY + midR * Math.sin((angle1 + angle2) / 2);
        
        arc.setAttribute("d", `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`);
        arc.setAttribute("class", "partner-arc");

        // Функция для создания текста
        const createLabel = (x, y, num) => {
            const txt = document.createElementNS("http://w3.org", "text");
            txt.setAttribute("x", x);
            txt.setAttribute("y", y);
            txt.setAttribute("class", "hex-text");
            txt.setAttribute("text-anchor", "middle");
            txt.setAttribute("alignment-baseline", "central");
            txt.textContent = num;
            return txt;
        };

        pairGroup.appendChild(arc);
        pairGroup.appendChild(createLabel(x1, y1, i));
        pairGroup.appendChild(createLabel(x2, y2, i + 1));
        
        svg.appendChild(pairGroup);
    }
</script>
</body>
</html>
