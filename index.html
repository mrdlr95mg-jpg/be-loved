<!DOCTYPE html>
<html>
<body style="margin:0; background:#050505; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; color:white; font-family:sans-serif;">

<div style="position:absolute; top:20px; text-align:center; width:100%;">
    <h2 style="color:#ffcc00; margin:0;">Механика Лунных Узлов</h2>
    <p style="opacity:0.7;">Пересечение орбиты Луны (белая) и Эклиптики (желтая)</p>
</div>

<svg viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Определяем градиент для объема Земли -->
    <defs>
        <radialGradient id="earthGrad">
            <stop offset="30%" stop-color="#3366ff" />
            <stop offset="100%" stop-color="#001133" />
        </radialGradient>
    </defs>

    <g transform="translate(400, 300)">
        <!-- 1. Эклиптика (Плоскость Солнца) - вид под углом -->
        <ellipse cx="0" cy="0" rx="300" ry="80" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="10,5" opacity="0.5" />
        <ellipse cx="0" cy="0" rx="300" ry="80" fill="#ffcc00" opacity="0.05" />

        <!-- 2. Орбита Луны (наклонена относительно эклиптики) -->
        <!-- Мы поворачиваем эллипс вокруг центра -->
        <g transform="rotate(15)">
            <ellipse cx="0" cy="0" rx="300" ry="100" fill="none" stroke="white" stroke-width="3" />
            <ellipse cx="0" cy="0" rx="300" ry="100" fill="white" opacity="0.03" />
        </g>

        <!-- 3. Земля в центре -->
        <circle r="30" fill="url(#earthGrad)" />
        <circle r="30" fill="none" stroke="#5588ff" stroke-width="1" opacity="0.5" />

        <!-- 4. ЛУННЫЕ УЗЛЫ (Точки пересечения двух эллипсов) -->
        <!-- Северный Узел -->
        <g transform="translate(295, 10)">
            <circle r="8" fill="red" />
            <circle r="12" fill="none" stroke="red" stroke-width="1">
                <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
            </circle>
            <text x="15" y="-15" fill="white" font-size="14" font-weight="bold">Северный Узел (Раху)</text>
        </g>

        <!-- Южный Узел -->
        <g transform="translate(-295, -10)">
            <circle r="8" fill="red" />
            <circle r="12" fill="none" stroke="red" stroke-width="1">
                <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
            </circle>
            <text x="-160" y="25" fill="white" font-size="14" font-weight="bold">Южный Узел (Кету)</text>
        </g>

        <!-- Линия узлов -->
        <line x1="-295" y1="-10" x2="295" y2="10" stroke="red" stroke-width="1" stroke-dasharray="5,5" opacity="0.6" />
    </g>
</svg>

<div style="position:absolute; bottom:20px; font-size:12px; opacity:0.5; max-width:400px; text-align:center;">
    Красные точки — это математические пересечения. Когда Луна проходит через них, она буквально «пронзает» плоскость, по которой движется Солнце.
</div>

</body>
</html>
