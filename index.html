<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Программные Партнеры: Магия Оппозиции</title>
    <style>
        :root { --gold: #ffd700; --cyan: #00f2ff; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .universe { position: relative; width: 500px; height: 500px; border: 1px solid #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        /* Кольцо с номерами (упрощенно) */
        .ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #1a1a1a; animation: rotate 60s linear infinite; }
        
        /* Линия связи между Солнцем и Землей */
        .connection { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, var(--gold), transparent, var(--cyan)); z-index: 1; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        .node { position: absolute; width: 50px; height: 50px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .node span { font-size: 10px; text-transform: uppercase; margin-top: 2px; }
        
        .sun { background: var(--gold); color: black; left: -25px; box-shadow: 0 0 30px var(--gold); }
        .earth { background: var(--cyan); color: black; right: -25px; box-shadow: 0 0 30px var(--cyan); }

        .info-panel { margin-top: 40px; text-align: center; max-width: 600px; padding: 20px; background: #111; border-radius: 15px; border-bottom: 3px solid var(--gold); }
        .pair-display { font-size: 32px; font-weight: bold; color: var(--gold); margin-bottom: 10px; letter-spacing: 5px; }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .controls { margin-top: 20px; }
        button { background: #222; color: white; border: 1px solid #444; padding: 10px 20px; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <div class="pair-display" id="pair-text">64 | 63</div>

    <div class="universe">
        <div class="ring" id="wheel"></div>
        <div class="connection" id="bridge">
            <div class="node sun">64<span>Sun</span></div>
            <div class="node earth">63<span>Earth</span></div>
        </div>
    </div>

    <div class="info-panel">
        <div id="desc">Эти ворота — зеркала. Если в одних линии идут 1-0-1, то в других 0-1-0. Они балансируют сознание.</div>
    </div>

    <div class="controls">
        <button onclick="nextPair()">Сменить пару партнеров</button>
    </div>

<script>
    const pairs = [
        { s: 64, e: 63, d: "Абстрактное и Логическое. Прошлое встречается с Будущим." },
        { s: 11, e: 12, d: "Идеи и их озвучивание. Гармония между концепцией и выражением." },
        { s: 24, e: 44, d: "Рационализация и Инстинкт. Память ума против памяти тела." },
        { s: 55, e: 59, d: "Дух и Интимность. Эмоциональная глубина и продолжение рода." },
        { s: 1, e: 2, d: "Янь и Инь. Творческое начало и Направление движения." }
    ];
    
    let current = 0;
    let rotation = 0;

    function nextPair() {
        current = (current + 1) % pairs.length;
        rotation += 72; // Имитируем поворот колеса
        
        const p = pairs[current];
        document.getElementById('pair-text').innerText = `${p.s} | ${p.e}`;
        document.getElementById('desc').innerText = p.d;
        document.getElementById('bridge').style.transform = `rotate(${rotation}deg)`;
        
        // Обновляем числа в узлах
        document.querySelector('.sun').innerHTML = `${p.s}<span>Sun</span>`;
        document.querySelector('.earth').innerHTML = `${p.e}<span>Earth</span>`;
    }
</script>
</body>
</html>
