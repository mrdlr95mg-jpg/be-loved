<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        .legend { display: flex; align-items: center; margin-bottom: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="legend"><div class="dot" style="background: #ffcc00"></div> Солнце (Центр)</div>
        <div class="legend"><div class="dot" style="background: #22aaee"></div> Земля (Орбита — Эклиптика)</div>
        <div class="legend"><div class="dot" style="background: #ffffff"></div> Луна (Орбита наклонена)</div>
        <div class="legend"><div class="dot" style="background: #ff0000"></div> <b>УЗЛЫ</b> (Точки пересечения)</div>
        <p style="font-size: 0.8em; opacity: 0.8;">Узлы — это места, где Луна "пробивает"<br>плоскость орбиты Земли.</p>
    </div>
    <script src="https://cdnjs.cloudflare.com"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. СОЛНЦЕ
        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffcc00 })
        );
        scene.add(sun);

        // 2. ОРБИТА ЗЕМЛИ (Эклиптика)
        const earthOrbitGeo = new THREE.TorusGeometry(10, 0.02, 16, 100);
        const earthOrbitMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
        const earthOrbit = new THREE.Mesh(earthOrbitGeo, earthOrbitMat);
        earthOrbit.rotation.x = Math.PI / 2;
        scene.add(earthOrbit);

        // Плоскость эклиптики (визуальный "пол")
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(10, 64),
            new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.05, side: THREE.DoubleSide })
        );
        floor.rotation.x = Math.PI / 2;
        scene.add(floor);

        // 3. ЗЕМЛЯ И ЕЕ ЛУННАЯ СИСТЕМА
        const earthSystem = new THREE.Group();
        scene.add(earthSystem);

        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 32, 32),
            new THREE.MeshPhongMaterial({ color: 0x22aaee })
        );
        earthSystem.add(earth);

        // Наклоненная орбита Луны
        const moonOrbitGroup = new THREE.Group();
        const moonPath = new THREE.Mesh(
            new THREE.TorusGeometry(3, 0.03, 16, 100),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        moonPath.rotation.x = Math.PI / 2;
        moonOrbitGroup.add(moonPath);
        
        // КЛЮЧЕВОЙ НАКЛОН (5 градусов)
        moonOrbitGroup.rotation.x = 0.25; 
        earthSystem.add(moonOrbitGroup);

        // 4. ЛУННЫЕ УЗЛЫ (Красные метки)
        const nodeGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        const nNode = new THREE.Mesh(nodeGeo, nodeMat);
        nNode.position.set(3, 0, 0); // На линии пересечения
        moonOrbitGroup.add(nNode);

        const sNode = new THREE.Mesh(nodeGeo, nodeMat);
        sNode.position.set(-3, 0, 0);
        moonOrbitGroup.add(sNode);

        // Свет
        const light = new THREE.PointLight(0xffffff, 2, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x222222));

        camera.position.set(15, 12, 15);
        camera.lookAt(0, 0, 0);

        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);
            angle += 0.005;

            // Двигаем Землю вокруг Солнца
            earthSystem.position.x = Math.cos(angle) * 10;
            earthSystem.position.z = Math.sin(angle) * 10;

            // Вращаем камеру для обзора
            camera.position.x = Math.cos(angle * 0.2) * 18;
            camera.position.z = Math.sin(angle * 0.2) * 18;
            camera.lookAt(earthSystem.position);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
